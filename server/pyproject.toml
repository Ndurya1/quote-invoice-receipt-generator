[project]
name = "server"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3,<4",
    "pwdlib[argon2]>=0.3,<1",
    "pyjwt>=2.14,<3",
    "python-dotenv>=1.0,<2",
    "reportlab>=4.0,<5",
]

[tool.fastapi]
entrypoint = "app.main:app"
